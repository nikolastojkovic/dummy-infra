name: Terraform Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply-dev:
    name: Terraform apply (dev)
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      action: "apply"
      environment: "dev"
      working_directory: "envs/dev"
      var_file: "dev.tfvars"
      aws_region: "eu-central-1"
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_DEV }}

  terraform-plan-staging:
    name: Terraform plan (staging)
    needs: terraform-apply-dev
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      action: "plan"
      environment: "staging"
      working_directory: "envs/staging"
      var_file: "staging.tfvars"
      aws_region: "eu-west-1"
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_STAGING }}

  staging-approval:
    name: Staging deployment approval
    needs: terraform-plan-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Approval granted
        run: echo "Staging deployment approved."

  terraform-apply-staging:
    name: Terraform apply (staging)
    needs: staging-approval
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      action: "apply"
      environment: "staging"
      working_directory: "envs/staging"
      var_file: "staging.tfvars"
      aws_region: "eu-west-1"
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_STAGING }}

  terraform-plan-prod:
    name: Terraform plan (prod)
    needs: terraform-apply-staging
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      action: "plan"
      environment: "prod"
      working_directory: "envs/prod"
      var_file: "prod.tfvars"
      aws_region: "us-east-1"
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_PROD }}

  prod-approval:
    name: Production deployment approval
    needs: terraform-plan-prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Approval granted
        run: echo "Production deployment approved."

  terraform-apply-prod:
    name: Terraform apply (prod)
    needs: prod-approval
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      action: "apply"
      environment: "prod"
      working_directory: "envs/prod"
      var_file: "prod.tfvars"
      aws_region: "us-east-1"
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_PROD }}
